<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fin Tech Pro</title>
    <!-- css -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- main-container -->
    <div class="main-container">
      <!--right-navbar  -->
      <div class="right-navbar">
        <div class="left-top-navbar">
          <div class="logo-nav">
            <img src="./assets/image.png" alt="logo-image" />
          </div>
          <div class="dashboard">
            <h3><a href="../dashboard/index.html">Dashboard</a></h3>
          </div>
          <div class="settig-icon">
            <h3>Settings</h3>
          </div>
        </div>
        <div class="bootom-left-content">
          <button>+ Add Transition</button>
        </div>
      </div>

      <!-- left-navbar -->
      <div class="left-navbar">
        <div class="top-nav">
          <p>top-nav</p>
          <button>Logout</button>
        </div>
        <div class="down-nav">
          <p></p>
          <div class="top-content-setting">
            <h1>Settings</h1>
            <p>Manage your account profile and app formatting</p>
          </div>
          <div class="center-content blue">
            <div class="left-content">
              <h2>Profile Details</h2>

              <div class="input-fild">
                <div class="fullname">
                  <label for="FullName"> Full Name</label>
                  <input type="text" />
                </div>

                <div class="currency">
                  <label for="currency">Primary Currency</label>

                  <select id="city" name="city">
                    <option value="">USD($)</option>
                    <option value="indore">Indore</option>
                    <option value="bhopal">Bhopal</option>
                    <option value="jabalpur">Jabalpur</option>
                    <option value="seoni">Seoni</option>
                  </select>
                </div>

              </div>
              <div class="save-change-button">
                <button>Save Changes</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- rightbar -->
    </div>
  </body>
</html>
